<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - Veterinaria</title>
</head>
<body>

  <h2>Formulario de Registro</h2>

  <form id="Untitled-1">
    <div>
      <label for="nombre">Nombre:</label><br>
      <input type="text" id="nombre" name="nombre" required>
    </div>
    <br>
    <div>
      <label for="apellido">Apellido:</label><br>
      <input type="text" id="apellido" name="apellido" required>
    </div>
    <br>
    <div>
      <label for="correo">Correo Electrónico:</label><br>
      <input type="email" id="correo" name="correo" required>
    </div>
    <br>
    <div>
      <label for="password">Contraseña:</label><br>
      <input type="password" id="password" name="password" required>
    </div>
    <br>
    <div>
      <label for="confirm-password">Confirmar Contraseña:</label><br>
      <input type="password" id="confirm-password" name="confirmPassword" required>
    </div>
    <br>
    <div>
      <label>¿Tienes mascota?</label><br>
      <input type="radio" id="mascota-si" name="tiene_mascota" value="si" required>
      <label for="mascota-si">Sí</label>
      <input type="radio" id="mascota-no" name="tiene_mascota" value="no" checked required>
      <label for="mascota-no">No</label>
    </div>
    <br>

    <fieldset>
      <legend>Datos de la Mascota</legend>
      <div>
        <label for="nombre-mascota">Nombre de la mascota:</label><br>
        <input type="text" id="nombre-mascota" name="nombre_mascota">
      </div>
      <br>
      <div>
        <label for="tipo-mascota">Tipo:</label><br>
        <select id="tipo-mascota" name="tipo_mascota">
          <option value="Perro">Perro</option>
          <option value="Gato">Gato</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <br>
      <div>
        <label for="edad-mascota">Edad (años):</label><br>
        <input type="number" id="edad-mascota" name="edad_mascota" min="0">
      </div>
      <br>
      <div>
        <label for="peso-mascota">Peso en kg (Opcional):</label><br>
        <input type="number" id="peso-mascota" name="peso_mascota" step="0.1" min="0">
      </div>
      <br>
      <div>
        <label for="raza-mascota">Raza:</label><br>
        <input type="text" id="raza-mascota" name="raza_mascota">
      </div>
    </fieldset>
    <br>
    <button type="submit">Crear Cuenta</button>
  </form>

  <p>¿Ya tienes cuenta? <a href="Untitled-2.html">Inicia sesión aquí</a></p>

  <script>
    document.getElementById('Untitled-1').addEventListener('submit', function(e) {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        alert('Las contraseñas no coinciden.');
        return;
      }

      const tieneMascota = document.querySelector('input[name="tiene_mascota"]:checked').value;

      const usuario = {
        nombre: document.getElementById('nombre').value,
        apellido: document.getElementById('apellido').value,
        correo: document.getElementById('correo').value,
        password: password,
        tieneMascota: tieneMascota,
        mascota: tieneMascota === 'si' ? {
          nombre: document.getElementById('nombre-mascota').value,
          tipo: document.getElementById('tipo-mascota').value,
          edad: document.getElementById('edad-mascota').value,
          peso: document.getElementById('peso-mascota').value,
          raza: document.getElementById('raza-mascota').value
        } : null
      };

      const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
      
      // Verificar si el correo ya existe
      const existe = usuarios.find(u => u.correo === usuario.correo);
      if (existe) {
        alert('El correo ya está registrado.');
        return;
      }

      usuarios.push(usuario);
      localStorage.setItem('usuarios', JSON.stringify(usuarios));
      localStorage.setItem('usuarioSesion', JSON.stringify(usuario));

      alert('¡Registro exitoso!');
      window.location.href = 'Untitled-3.html';
    });
  </script>
</body>
</html>
